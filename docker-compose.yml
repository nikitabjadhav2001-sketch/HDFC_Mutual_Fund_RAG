services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/hf-inference}
      HF_TOKEN: ${HF_TOKEN:-}
      API_KEY: ${API_KEY:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      QUERY_CACHE_TTL: ${QUERY_CACHE_TTL:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20000000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60.0}
    volumes:
      - ./storage:/srv/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/hf-inference}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./storage:/srv/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.ingestion.worker.WorkerSettings

  ui:
    build:
      context: ./ui
      args:
        VITE_API_KEY: ${API_KEY:-}
        VITE_ADMIN_KEY: ${ADMIN_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - api

  # `docker compose --profile full up` adds the observability stack.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["full"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  pgdata:
